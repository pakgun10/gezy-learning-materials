# Gezy Learning Materials — reverse proxy nginx
#
# Cara pakai:
#   sudo cp nginx.conf /etc/nginx/sites-available/gezy-materials
#   sudo ln -s /etc/nginx/sites-available/gezy-materials /etc/nginx/sites-enabled/
#   (ganti server_name dengan domain Pak Gun, mis. materials.gezytech.web.id)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d materials.gezytech.web.id   # HTTPS gratis
#
# Catatan: COOKIE_SECURE=1 di systemd membutuhkan X-Forwarded-Proto di bawah ini.

server {
    listen 80;
    server_name materials.gezytech.web.id;

    # Izinkan unggahan besar (samakan dengan MAX_UPLOAD_MB + sedikit cadangan):
    client_max_body_size 550m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Jangan meneruskan X-Forwarded-For dari client; rate limiter aplikasi
        # memakai IP yang ditulis ulang oleh proxy tepercaya ini.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Unggahan besar butuh waktu — longgarkan timeout:
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Kompresi untuk teks (tidak untuk file biner):
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
